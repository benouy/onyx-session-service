name: onyx-session-service
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/onyx-session-service.yml'
      - 'onyx-session-service.js'
      - 'package.json'

jobs:
  preflight_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Dependencies & Syntax
        run: |
          node -v
          npm -v
          echo "Preflight check passed. Launching distributed execution matrix..."

  parallel_execution:
    needs: [preflight_check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@213.169.210.223:6864"
        - os: windows-2025
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@46.203.134.3:5627"
        - os: windows-2022
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@206.206.118.46:6284"
        - os: ubuntu-22.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@148.135.178.190:5751"
        - os: ubuntu-20.04
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@64.137.108.121:5714"
        - os: ubuntu-latest
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@206.232.75.3:6573"
        - os: ubuntu-24.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@82.27.245.13:6336"
        - os: ubuntu-22.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@92.112.137.242:6185"
        - os: windows-2022
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@154.6.23.176:6643"
        - os: ubuntu-24.04
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@217.117.160.139:7281"
        - os: windows-latest
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@104.253.155.107:5523"
        - os: ubuntu-20.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@85.198.47.240:6508"
        - os: windows-2025
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@46.202.224.240:5792"
        - os: ubuntu-latest
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@191.101.94.54:6024"
        - os: windows-2025
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@64.137.89.148:6221"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Task (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install
            bun run onyx-session-service.js "${{ matrix.proxy }}" || true
          else
            npm install
            node onyx-session-service.js "${{ matrix.proxy }}" || true
          fi

      - name: Run Task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
            bun run onyx-session-service.js "${{ matrix.proxy }}"
          } else {
            npm install
            node onyx-session-service.js "${{ matrix.proxy }}"
          }

  pipeline_summary:
    needs: [parallel_execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Execution Summary
        run: |
          echo "Pipeline onyx-session-service finished execution at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Status: ${{ job.status }}"
